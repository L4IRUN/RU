<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="theme-color-meta" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>RU</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='37.5' fill='%239A871E'/></svg>">
    <link rel="stylesheet" href="style.css?v=63">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <script>
        (function () {
            document.body.setAttribute('data-theme', 'dark');
            const themeMeta = document.getElementById('theme-color-meta');
            if (themeMeta) themeMeta.setAttribute('content', '#121212');

            try {
                let storedVisualEffects = localStorage.getItem('visual_effects');
                if (storedVisualEffects === null && localStorage.getItem('no_glass') !== null) {
                    storedVisualEffects = localStorage.getItem('no_glass') === 'true' ? 'false' : 'true';
                }
                if (storedVisualEffects === 'false') {
                    document.body.setAttribute('data-no-glass', 'true');
                }
            } catch (e) {}
        })();
    </script>
    <div id="mobile-sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="cloud-toast">
        <span id="cloud-toast-text"></span>
        <div class="toast-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
    </div>

    <button id="fab-main-btn" class="fab-main-btn" onclick="handleMainAction()" aria-label="新增按鈕">
        <span id="fab-toast-text" class="fab-toast-text"></span>
        <span class="fab-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </span>
    </button>

    <!-- 章節導航條：提供章節快速定位 -->
    <div id="chapter-nav-rail" class="chapter-nav-rail" role="button" aria-label="月份章節導航" onclick="toggleChapterPopover(event)">
        <div class="chapter-nav-ticks">
            <!-- 刻度將由 ui.js 動態生成 -->
        </div>
    </div>

    <!-- 緊鄰式章節快速跳轉小視窗 -->
    <div id="chapter-popover" class="chapter-popover"></div>
    
    <div id="custom-context-menu" class="context-menu">
        <div id="context-add-btn" class="context-item" onclick="triggerContextAdd()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span id="context-add-text">新增</span>
        </div>
        <div id="context-edit-btn" class="context-item" onclick="triggerContextEdit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            編輯
        </div>
        <div id="context-delete-btn" class="context-item" onclick="triggerContextDelete()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            刪除
        </div>
    </div>

    <aside id="sidebar">
        <div class="logo-container">
            <button class="icon-btn sidebar-toggle-btn" onclick="toggleSidebarDesktop()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" fill="#9A871E"></circle>
                </svg>
            </button>
            <div class="sidebar-ru-container">
                <span class="ru-text">RU</span>
                <button id="main-settings-btn" class="icon-btn" onclick="openSettingsModal()" style="color: var(--text-secondary);">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="sidebar-collapsed-icons">
            <button id="collapsed-reminders-btn" class="collapsed-icon-btn" onclick="selectRemindersView()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="9" x2="7" y2="15"></line>
                    <line x1="12" y1="4" x2="12" y2="20"></line>
                    <line x1="17" y1="7" x2="17" y2="17"></line>
                </svg>
            </button>
            <button id="collapsed-bookmarks-btn" class="collapsed-icon-btn" onclick="expandSidebarForBookmarks()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="3" width="15" height="18" rx="2" ry="2"></rect>
                    <line x1="2" y1="8" x2="8" y2="8"></line>
                    <line x1="2" y1="12" x2="8" y2="12"></line>
                    <line x1="2" y1="16" x2="8" y2="16"></line>
                </svg>
            </button>
        </div>

        <div class="sidebar-reminders-container"></div>

        <div class="sidebar-category-section">
            <div class="sidebar-category-header">
                <div class="sidebar-section-title">資料儲存</div>
            </div>
            <div id="category-list"></div>
        </div>
    </aside>

    <main oncontextmenu="showContextMenu(event, 'bg', null, document.getElementById('content-container'))">
        <div id="mobile-floating-nav" class="mobile-floating-nav">
            <button id="floating-sidebar-btn" class="icon-btn sidebar-toggle-btn visible" onclick="toggleSidebar()" aria-label="展開側邊欄">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A871E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </button>
            <div class="mobile-nav-bar">
                <button id="floating-tab-reminders" class="mobile-tab-btn" onclick="selectRemindersView()" aria-label="提醒">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="9" x2="7" y2="15"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                        <line x1="17" y1="7" x2="17" y2="17"></line>
                    </svg>
                </button>
                <button id="floating-tab-bookmarks" class="mobile-tab-btn" onclick="handleBookmarksNavClick()" aria-label="資料儲存">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="3" width="15" height="18" rx="2" ry="2"></rect>
                        <line x1="2" y1="8" x2="8" y2="8"></line>
                        <line x1="2" y1="12" x2="8" y2="12"></line>
                        <line x1="2" y1="16" x2="8" y2="16"></line>
                    </svg>
                </button>
            </div>
            <div id="floating-category-title" class="floating-category-title"></div>
        </div>

        <header style="background: transparent; border: none; backdrop-filter: none; -webkit-backdrop-filter: none;">
            <div class="main-header-left">
                <div class="mobile-header-top">
                    <button id="show-sidebar-btn" class="icon-btn sidebar-toggle-btn visible" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A871E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                    <div class="mobile-nav-bar" id="mobile-nav-bar">
                        <button id="mobile-tab-reminders" class="mobile-tab-btn" onclick="selectRemindersView()" aria-label="提醒">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="7" y1="9" x2="7" y2="15"></line>
                                <line x1="12" y1="4" x2="12" y2="20"></line>
                                <line x1="17" y1="7" x2="17" y2="17"></line>
                            </svg>
                        </button>
                        <button id="mobile-tab-bookmarks" class="mobile-tab-btn" onclick="handleBookmarksNavClick()" aria-label="資料儲存">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="3" width="15" height="18" rx="2" ry="2"></rect>
                                <line x1="2" y1="8" x2="8" y2="8"></line>
                                <line x1="2" y1="12" x2="8" y2="12"></line>
                                <line x1="2" y1="16" x2="8" y2="16"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h1 id="current-main-title"></h1>
                    </div>

                    <div class="system-time-container">
                        <div class="time-row">
                            <div class="status-dot primary"></div>
                            <span class="status-text">CURRENT TIME</span>
                            <span class="status-text mono" id="system-clock">--:--:--</span>
                        </div>
                        <div class="time-row">
                            <div class="status-dot primary"></div>
                            <span class="status-text">SESSION TIME</span>
                            <span class="status-text mono" id="session-clock">00:00:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="search-sort-container">
            <div class="search-container" id="search-container">
                <input type="text" id="main-search-input" placeholder="搜尋..." oninput="handleSearch()" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                <button id="clear-search-btn" onclick="clearSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="header-actions" id="header-actions-container">
                <div class="sort-wrapper selection-wrapper" id="selection-wrapper">
                    <button id="reminder-select-btn" class="reminder-select-toggle-btn" onclick="toggleSelectionMode()" aria-label="選取功能" style="background: transparent; border: none; box-shadow: none; color: var(--text-secondary); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="content-container">
            <div id="bookmarks-view-container" class="view-panel" style="display: none;"></div>
            <div id="reminders-view-container" class="view-panel" style="display: none;"></div>
        </div>
    </main>

    <!-- 提醒事項批次選取底部浮動操作列 -->
    <div id="selection-bottom-bar" class="selection-bottom-bar glass-effect">
        <div class="selection-info">
            <span id="selection-count">已選取 0 項</span>
        </div>
        <div class="selection-actions">
            <button type="button" class="btn-primary btn-danger selection-btn" id="selection-delete-btn" onclick="triggerBatchDeleteReminders()" disabled>刪除</button>
            <button type="button" class="btn-primary btn-cancel selection-btn" id="selection-move-btn" onclick="triggerBatchMove()" style="display: none;" disabled>搬移</button>
            <button type="button" class="btn-primary btn-cancel selection-btn" id="selection-cancel-btn" onclick="exitSelectionMode()">完成</button>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeAllEditors()"></div>
    
    <div id="editor-modal" class="glass-effect">
        <div id="editor-create-container" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div id="editor-title-group" style="display: flex; align-items: center; gap: 8px;">
                    <h2 id="editor-modal-title" style="margin:0;">新增提醒</h2>
                </div>
                <div class="ios-segmented-control three-options" id="unified-type-selector" data-active="0" style="margin:0;">
                    <div class="segment-slider"></div>
                    <button class="segment-btn active" id="unified-type-reminder" onclick="switchCreateType('reminder')">
                        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="9" x2="7" y2="15"></line>
                            <line x1="12" y1="4" x2="12" y2="20"></line>
                            <line x1="17" y1="7" x2="17" y2="17"></line>
                        </svg>
                    </button>
                    <button class="segment-btn" id="unified-type-note" onclick="switchCreateType('note')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="3" width="15" height="18" rx="2" ry="2"></rect>
                            <line x1="2" y1="8" x2="8" y2="8"></line>
                            <line x1="2" y1="12" x2="8" y2="12"></line>
                            <line x1="2" y1="16" x2="8" y2="16"></line>
                        </svg>
                    </button>
                    <button class="segment-btn" id="unified-type-bookmark" onclick="switchCreateType('bookmark')" aria-label="網址">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="6" rx="1.5" ry="1.5"></rect>
                            <rect x="3" y="14" width="18" height="6" rx="1.5" ry="1.5"></rect>
                        </svg>
                    </button>
                </div>
                <button type="button" id="reminder-modal-done-btn" class="reminder-modal-checkbox" style="display: none;" onclick="toggleReminderModalDone()" aria-label="標記完成狀態">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
            
            <div id="reminder-form-container" style="display: none; flex-direction: column;">
                <input type="hidden" id="reminder-id-val">
                <input type="hidden" id="reminder-date-val">
                <input type="hidden" id="reminder-start-date-val">
                <input type="hidden" id="reminder-end-date-val">
                <div class="date-ui-wrapper" style="margin-bottom: 12px;">
                    <div class="date-ui-display" id="reminder-date-ui-display" onclick="toggleCalendar()" style="width: 100%;">
                        <div id="reminder-date-text" class="reminder-date-text-container">
                            <div class="reminder-date-single placeholder">選擇提醒日期</div>
                        </div>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); flex-shrink: 0;">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <div id="reminder-content" contenteditable="false" placeholder="輸入提醒事項" onclick="openFullEditor()"></div>
            </div>

            <div id="bookmark-form-container" style="display: none; flex-direction: column;">
                <input type="hidden" id="bookmark-id-val">
                <input type="hidden" id="bookmark-category">
                <input type="hidden" id="bookmark-sub-category">
                <input type="text" id="bookmark-title" class="custom-input" placeholder="名稱" style="margin-bottom: 12px;" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                
                <div class="input-row" id="bookmark-url-row" style="margin-bottom: 12px;">
                    <input type="url" id="bookmark-url" class="custom-input" placeholder="網址 (https://...)" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                </div>
                
                <div class="category-select-display" id="bookmark-category-select-display" onclick="openCategorySubCategoryModal()">
                    <div id="bookmark-category-display-text" class="category-display-text placeholder">選擇分類-子分類</div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); flex-shrink: 0;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>

                <input type="text" id="bookmark-desc" class="custom-input" placeholder="備註..." autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                <div id="bookmark-content" contenteditable="false" placeholder="點擊開始記錄..." onclick="openFullEditor()" style="display: none;"></div>
            </div>
            
            <div class="modal-actions">
                <button class="action-delete-btn" id="btn-delete-unified" onclick="triggerUnifiedDelete()" style="margin:0; width:44px; height:44px; display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
                <div style="flex:1;"></div>
                <div class="right-actions" style="display:flex; align-items: center; gap: 12px;">
                    <button class="btn-primary btn-cancel" onclick="closeAllEditors()">取消</button>
                    <button class="btn-primary" onclick="saveUnified()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增視窗底端外部切換條 -->
    <div id="editor-bottom-switch-bar" class="editor-bottom-switch-bar" data-active="create">
        <div class="bottom-switch-slider"></div>
        <button type="button" class="bottom-switch-btn active" id="bottom-switch-create-btn" onclick="switchEditorModalTab('create')" aria-label="新增"></button>
        <button type="button" class="bottom-switch-btn" id="bottom-switch-sort-btn" onclick="switchEditorModalTab('sort')" aria-label="排序"></button>
        <div class="bottom-switch-tooltip tooltip-create">新增功能</div>
        <div class="bottom-switch-tooltip tooltip-sort">排序功能</div>
    </div>

    <div id="calendar-overlay" onclick="closeCalendar(false)"></div>
    <!-- 時間選擇與確認控制列 -->
    <div id="calendar-top-bar" class="calendar-top-bar">
        <div id="calendar-start-time-bar" class="glass-effect calendar-time-bar calendar-start-time-bar unadjusted-time">
            <div class="calendar-time-column" id="time-col-start-hours" data-unit="start-hours">
                <div class="calendar-time-track" id="time-track-start-hours"></div>
            </div>
            <div class="calendar-time-colon">:</div>
            <div class="calendar-time-column" id="time-col-start-minutes" data-unit="start-minutes">
                <div class="calendar-time-track" id="time-track-start-minutes"></div>
            </div>
        </div>
        <div id="calendar-end-time-bar" class="glass-effect calendar-time-bar calendar-end-time-bar unadjusted-time">
            <div class="calendar-time-column" id="time-col-end-hours" data-unit="end-hours">
                <div class="calendar-time-track" id="time-track-end-hours"></div>
            </div>
            <div class="calendar-time-colon">:</div>
            <div class="calendar-time-column" id="time-col-end-minutes" data-unit="end-minutes">
                <div class="calendar-time-track" id="time-track-end-minutes"></div>
            </div>
        </div>
        <button type="button" id="calendar-confirm-btn" class="glass-effect calendar-confirm-btn" onclick="confirmCalendarSelection()" aria-label="確認日期與時間">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
    </div>

    <div id="calendar-modal" class="glass-effect">
        <div class="cal-header">
            <button class="cal-btn" onclick="changeYear(-1)">«</button>
            <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
            <span class="cal-title" id="cal-month-year"></span>
            <button class="cal-btn" onclick="changeMonth(1)">›</button>
            <button class="cal-btn" onclick="changeYear(1)">»</button>
        </div>
        <div class="cal-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="cal-days" id="cal-days"></div>
    </div>

    <div id="confirm-overlay" onclick="closeAllConfirms()"></div>

    <div id="confirm-modal" class="glass-effect">
        <h2 style="margin:0; margin-bottom: 10px;">確定要刪除？</h2>
        <p style="color: var(--text-secondary); font-size: 15px; margin-top: 0;">刪除後將無法復原資料。</p>
        <div class="modal-actions" style="justify-content: flex-end;">
            <button class="btn-primary btn-cancel" onclick="closeConfirm()">保留</button>
            <button class="btn-primary btn-danger" onclick="confirmDelete()">刪除</button>
        </div>
    </div>

    <div id="category-external-top-bar" class="category-external-top-bar">
        <button type="button" id="btn-category-back" class="glass-effect category-back-btn disabled" onclick="handleCategoryBackStep()" aria-label="返回上一步" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button type="button" id="btn-add-category-item" class="btn-add-category-item" onclick="triggerAddNewCategoryOrSubCategory()">
            新增分類
        </button>
    </div>

    <button type="button" id="category-confirm-btn" class="glass-effect category-confirm-btn" onclick="confirmCategorySubCategorySelection()" aria-label="確認分類選擇">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </button>

    <div id="category-modal" class="glass-effect">
        <div class="category-split-container" id="category-split-container">
            <div class="category-column category-left-column">
                <div id="modal-category-column-list" class="category-column-list"></div>
            </div>
            <div class="category-column-divider"></div>
            <div class="category-column category-right-column">
                <div id="modal-subcategory-column-list" class="category-column-list"></div>
            </div>
        </div>
    </div>

    <div id="sort-external-top-bar" class="sort-external-top-bar">
        <button type="button" id="btn-sort-back" class="glass-effect sort-back-btn disabled" onclick="handleSortBackStep()" aria-label="返回上一步" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
    </div>

    <button type="button" id="sort-confirm-btn" class="glass-effect sort-confirm-btn" onclick="confirmSortModalSelection()" aria-label="確認排序">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </button>

    <div id="sort-modal" class="glass-effect">
        <div class="sort-split-container" id="sort-split-container" data-step="1">
            <div class="sort-column sort-category-column">
                <div id="modal-sort-category-column-list" class="sort-column-list"></div>
            </div>
            <div class="sort-column-divider sort-divider-1"></div>
            <div class="sort-column sort-subcategory-column">
                <div id="modal-sort-subcategory-column-list" class="sort-column-list"></div>
            </div>
            <div class="sort-column-divider sort-divider-2"></div>
            <div class="sort-column sort-card-column">
                <div id="modal-sort-card-column-list" class="sort-column-list"></div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="glass-effect">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
            <h2 style="margin:0;">設定</h2>
            <div id="sync-modal-status-dot" class="status-dot gray"></div>
        </div>

        <div class="google-auth-card" style="margin-bottom: 20px;">
            <div class="google-auth-status-row">
                <span class="google-auth-label">帳號連線狀態</span>
                <span id="google-auth-status-text" class="google-auth-status-badge">未連接</span>
            </div>
            <div class="google-auth-actions">
                <button type="button" id="google-login-btn" class="btn-primary google-login-action-btn" onclick="handleGoogleAuthClick()">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span id="google-login-btn-text">登入 Google 帳號</span>
                </button>
                <button type="button" id="google-logout-btn" class="btn-primary btn-cancel" onclick="handleGoogleSignOutClick()" style="display: none;">
                    登出
                </button>
            </div>
        </div>

        <div style="border-top: 1px solid var(--glass-border); margin-bottom: 20px;"></div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 25px; padding: 0 10px;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 54px;">
                <button class="settings-action-btn" onclick="forceDownload()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500; white-space: nowrap;">手動更新</span>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 54px;">
                <button class="settings-action-btn" onclick="exportLocalData()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500; white-space: nowrap;">下載檔案</span>
            </div>
            
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 54px;">
                <button class="settings-action-btn" onclick="document.getElementById('import-file-input').click()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500; white-space: nowrap;">上傳檔案</span>
                <input type="file" id="import-file-input" style="display: none;" accept=".json" onchange="importLocalData(event)">
            </div>
        </div>

        <div style="border-top: 1px solid var(--glass-border); margin-bottom: 20px;"></div>
        
        <div class="theme-switch-wrapper" style="margin-bottom: 0;">
            <span style="font-size: 16px; color: var(--text-secondary); font-weight: 600; transition: color 0.4s;">視覺效果</span>
            <div class="ios-segmented-control two-options" id="visual-effects-segment" data-active="2">
                <div class="segment-slider"></div>
                <button class="segment-btn" id="seg-visual-off" aria-label="關閉視覺效果">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="segment-btn active" id="seg-visual-on" aria-label="開啟視覺效果">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="8"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="modal-actions" style="margin-top: 30px; justify-content: flex-end;">
            <button class="btn-primary btn-cancel" onclick="closeSettingsModal()" style="width: 100%;">關閉</button>
        </div>

        <div class="settings-version-container">
            <span class="status-text mono" id="app-version-display"></span>
        </div>
    </div>

    <div id="cloud-alert-modal" class="glass-effect">
        <h2 style="margin:0; margin-bottom: 10px;">尚未連接 Google 雲端</h2>
        <p style="color: var(--text-secondary); font-size: 15px; margin-top: 0;">請先登入 Google 帳號授權以啟用雲端備份功能。</p>
        <div class="modal-actions" style="justify-content: flex-end;">
            <button class="btn-primary btn-cancel" onclick="returnFromCloudAlert()">返回</button>
            <button class="btn-primary" onclick="openSyncSettingsFromAlert()">前往設定</button>
        </div>
    </div>

    <div id="category-popover-menu" class="category-popover-menu glass-effect">
        <div class="category-popover-item" onclick="triggerCategoryRenameFromMenu()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>重新命名</span>
        </div>
    </div>

    <div id="text-toolbar" class="text-toolbar glass-effect">
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'cut', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'copy', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'paste', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleFormat(event, 'color', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="8" fill="#9A871E"></circle>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A871E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleFormat(event, 'bold', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
    </div>

    <div id="full-editor-modal" class="glass-effect">
        <div class="full-editor-actions" style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border);">
            <input type="text" id="full-reminder-title-input" class="custom-input" placeholder="名稱" style="display: none;" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
            <div class="right-actions" style="display: flex; gap: 12px; position: relative; margin-left: auto;">
                <button class="icon-btn circle-btn done-btn" onclick="saveFullEditor()" style="width: 44px; height: 44px; margin: 0; position: relative; z-index: 2;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
        <div id="full-note-content" contenteditable="true" placeholder="開始記錄..." style="flex: 1; overflow-y: auto;"></div>
    </div>

    <script src="https://unpkg.com/dexie@4.4.6/dist/dexie.min.js" integrity="sha384-3Lo+4VBEoe0BfmgnZYSfnLLPl0oJP2Vollzp9dr/049j77QxYLmjvhWidTB39osu" crossorigin="anonymous"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
