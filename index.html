<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="theme-color-meta" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>RU</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='37.5' fill='%239A871E'/></svg>">
    <link rel="stylesheet" href="style.css?v=66">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <script>
        (function () {
            document.body.setAttribute('data-theme', 'dark');
            const themeMeta = document.getElementById('theme-color-meta');
            if (themeMeta) themeMeta.setAttribute('content', '#121212');

            try {
                let storedVisualEffects = localStorage.getItem('visual_effects');
                if (storedVisualEffects === null && localStorage.getItem('no_glass') !== null) {
                    storedVisualEffects = localStorage.getItem('no_glass') === 'true' ? 'false' : 'true';
                }
                if (storedVisualEffects === 'false') {
                    document.body.setAttribute('data-no-glass', 'true');
                }
            } catch (e) {}
        })();
    </script>
    <div id="mobile-sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="cloud-toast">
        <span id="cloud-toast-text"></span>
        <div class="toast-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
    </div>

    <button id="fab-main-btn" class="fab-main-btn" onclick="handleMainAction()" aria-label="新增按鈕">
        <span id="fab-toast-text" class="fab-toast-text"></span>
        <span class="fab-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </span>
    </button>

    <!-- 章節導航條：提供章節快速定位 -->
    <div id="chapter-nav-rail" class="chapter-nav-rail" role="button" aria-label="月份章節導航" onclick="toggleChapterPopover(event)">
        <div class="chapter-nav-ticks">
            <!-- 刻度將由 ui.js 動態生成 -->
        </div>
    </div>

    <!-- 緊鄰式章節快速跳轉小視窗 -->
    <div id="chapter-popover" class="chapter-popover"></div>
    
    <div id="custom-context-menu" class="context-menu">
        <div id="context-add-btn" class="context-item" onclick="triggerContextAdd()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span id="context-add-text">新增</span>
        </div>
        <div id="context-edit-btn" class="context-item" onclick="triggerContextEdit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            編輯
        </div>
        <div id="context-delete-btn" class="context-item danger" onclick="triggerContextDelete()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            刪除
        </div>
    </div>

    <aside id="sidebar">
        <div class="logo-container">
            <button class="icon-btn sidebar-toggle-btn" onclick="toggleSidebarDesktop()" aria-label="切換側邊欄">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" fill="#9A871E"></circle>
                </svg>
            </button>
            <div class="sidebar-ru-container">
                <span class="ru-text">RU</span>
            </div>
        </div>

        <div class="sidebar-collapsed-icons">
            <button id="collapsed-reminders-btn" class="collapsed-icon-btn" onclick="selectRemindersView()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="9" x2="7" y2="15"></line>
                    <line x1="12" y1="4" x2="12" y2="20"></line>
                    <line x1="17" y1="7" x2="17" y2="17"></line>
                </svg>
            </button>
            <button id="collapsed-bookmarks-btn" class="collapsed-icon-btn" onclick="expandSidebarForBookmarks()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
        </div>

        <div class="sidebar-reminders-container"></div>

        <div class="sidebar-category-section">
            <div class="sidebar-category-header">
                <div class="sidebar-section-title">資料儲存</div>
                <div class="sidebar-category-actions">
                    <button id="sidebar-add-category-btn" class="sidebar-add-category-btn" onclick="startInlineAddMainCategory()" aria-label="新增分類">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <button id="sidebar-sort-btn" class="sidebar-sort-btn" onclick="openSortModal()" aria-label="排序資料儲存">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="6" rx="1.5" ry="1.5"></rect>
                            <rect x="3" y="14" width="18" height="6" rx="1.5" ry="1.5"></rect>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="category-list"></div>
        </div>

        <div class="sidebar-settings-section">
            <div class="sidebar-profile-row">
                <button type="button" id="sidebar-profile-trigger" class="sidebar-profile-trigger" onclick="handleSidebarProfileClick(event)" aria-label="個人資料">
                    <span class="sidebar-profile-avatar">
                        <img id="sidebar-avatar-img" alt="頭像" style="display: none;">
                        <span id="sidebar-avatar-placeholder">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </span>
                    <span id="sidebar-username-text" class="sidebar-profile-name">RU</span>
                </button>
                <button type="button" id="main-settings-btn" class="sidebar-settings-gear-btn" onclick="openSettingsModal()" aria-label="設定">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <main oncontextmenu="showContextMenu(event, 'bg', null, document.getElementById('content-container'))">
        <div id="mobile-floating-nav" class="mobile-floating-nav">
            <button type="button" id="floating-sidebar-btn" class="floating-sidebar-btn" onclick="toggleSidebar(event)" aria-label="開啟側邊欄">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
            </button>
            <div id="floating-category-title" class="floating-category-title"></div>
        </div>

        <header style="background: transparent; border: none; backdrop-filter: none; -webkit-backdrop-filter: none;">
            <div class="mobile-header-top-row">
                <button type="button" id="title-sidebar-btn" class="title-sidebar-btn" onclick="toggleSidebar(event)" aria-label="開啟側邊欄">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                    </svg>
                </button>
                <div id="floating-avatar-group" class="floating-avatar-group">
                    <button type="button" id="floating-avatar-btn" class="floating-avatar-btn" onclick="toggleFloatingAvatarPopover(event)" aria-label="個人選單">
                        <img id="floating-avatar-img" alt="頭像" style="display: none;">
                        <span id="floating-avatar-placeholder">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </button>
                    <div id="floating-avatar-popover" class="floating-avatar-popover glass-effect">
                        <div class="floating-avatar-header-row">
                            <div id="floating-popover-username" class="floating-avatar-menu-header">RU</div>
                        </div>
                        <div class="floating-avatar-menu-items">
                            <button type="button" id="floating-reconnect-btn" class="floating-avatar-menu-item" onclick="handleFloatingManualSync(event)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M7.3 8.2a5.2 5.2 0 0 1 10.4 0"></path>
                                    <path d="M10.3 15.8V8.2a2.2 2.2 0 0 1 4.4 0v3.3h2.1a4.2 4.2 0 0 1 4.2 4.2v2.6a3.7 3.7 0 0 1-3.7 3.7h-2.5"></path>
                                    <path d="M10.3 15.8l-1.5-1.3a2.6 2.6 0 0 0-3.7 3.7l4.1 3.8"></path>
                                    <line x1="9.2" y1="22" x2="14.8" y2="22"></line>
                                </svg>
                                <span>手動同步</span>
                            </button>
                            <button type="button" id="floating-logout-btn" class="floating-avatar-menu-item danger" onclick="handleFloatingSignOut(event)" style="display: none;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                <span>登出</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="main-header-left">
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h1 id="current-main-title"></h1>
                    </div>

                    <div class="system-time-container">
                        <div class="time-row">
                            <div class="status-dot primary"></div>
                            <span class="status-text">CURRENT TIME</span>
                            <span class="status-text mono" id="system-clock">--:--:--</span>
                        </div>
                        <div class="time-row">
                            <div class="status-dot primary"></div>
                            <span class="status-text">SESSION TIME</span>
                            <span class="status-text mono" id="session-clock">00:00:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="search-sort-container">
            <div class="search-container" id="search-container">
                <input type="text" id="main-search-input" placeholder="搜尋..." oninput="handleSearch()" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                <button id="clear-search-btn" onclick="clearSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="header-actions" id="header-actions-container">
                <div class="sort-wrapper selection-wrapper" id="selection-wrapper">
                    <button id="reminder-select-btn" class="reminder-select-toggle-btn" onclick="toggleSelectionMode()" aria-label="選取功能" style="background: transparent; border: none; box-shadow: none; color: var(--text-secondary); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </button>
                </div>
                <button id="header-sort-btn" class="header-sort-btn" onclick="openSortModal()" aria-label="排序功能" style="background: transparent; border: none; box-shadow: none; color: var(--text-secondary); width: 44px; height: 44px; display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="6" rx="1.5" ry="1.5"></rect>
                        <rect x="3" y="14" width="18" height="6" rx="1.5" ry="1.5"></rect>
                    </svg>
                </button>
                <button id="header-more-btn" class="header-more-btn" onclick="toggleHeaderPopoverMenu(event)" aria-label="選單">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <div id="content-container">
            <div id="bookmarks-view-container" class="view-panel" style="display: none;"></div>
            <div id="reminders-view-container" class="view-panel" style="display: none;"></div>
        </div>
    </main>

    <!-- 提醒事項批次選取底部浮動操作列 -->
    <div id="selection-bottom-bar" class="selection-bottom-bar glass-effect">
        <div class="selection-info">
            <span id="selection-count">已選取 0 項</span>
        </div>
        <div class="selection-actions">
            <button type="button" class="btn-primary btn-danger selection-btn" id="selection-delete-btn" onclick="triggerBatchDeleteReminders()" disabled>刪除</button>
            <button type="button" class="btn-primary btn-cancel selection-btn" id="selection-move-btn" onclick="triggerBatchMove()" style="display: none;" disabled>搬移</button>
            <button type="button" class="btn-primary btn-cancel selection-btn" id="selection-cancel-btn" onclick="exitSelectionMode()">完成</button>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeAllEditors()"></div>
    
    <div id="editor-modal" class="glass-effect">
        <div id="editor-create-container" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div id="editor-title-group" style="display: flex; align-items: center; gap: 8px;">
                    <h2 id="editor-modal-title" style="margin:0;">新增提醒</h2>
                </div>
                <div class="ios-segmented-control three-options" id="unified-type-selector" data-active="0" style="margin:0;">
                    <div class="segment-slider"></div>
                    <button class="segment-btn active" id="unified-type-reminder" onclick="switchCreateType('reminder')">
                        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="9" x2="7" y2="15"></line>
                            <line x1="12" y1="4" x2="12" y2="20"></line>
                            <line x1="17" y1="7" x2="17" y2="17"></line>
                        </svg>
                    </button>
                    <button class="segment-btn" id="unified-type-bookmark" onclick="switchCreateType('bookmark')" aria-label="網址">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <g transform="rotate(-45 12 12)">
                                <path d="M9 17H7A5 5 0 0 1 7 7h2"></path>
                                <path d="M15 7h2a5 5 0 1 1 0 10h-2"></path>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </g>
                        </svg>
                    </button>
                    <button class="segment-btn" id="unified-type-note" onclick="switchCreateType('note')" aria-label="內容">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="3" width="15" height="18" rx="2" ry="2"></rect>
                            <line x1="2" y1="8" x2="8" y2="8"></line>
                            <line x1="2" y1="12" x2="8" y2="12"></line>
                            <line x1="2" y1="16" x2="8" y2="16"></line>
                        </svg>
                    </button>
                </div>
                <button type="button" id="reminder-modal-done-btn" class="reminder-modal-checkbox" style="display: none;" onclick="toggleReminderModalDone()" aria-label="標記完成狀態">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
            
            <div id="reminder-form-container" style="display: none; flex-direction: column;">
                <input type="hidden" id="reminder-id-val">
                <input type="hidden" id="reminder-date-val">
                <input type="hidden" id="reminder-start-date-val">
                <input type="hidden" id="reminder-end-date-val">
                <div class="date-ui-wrapper" style="margin-bottom: 12px;">
                    <div class="date-ui-display" id="reminder-date-ui-display" onclick="toggleCalendar()" style="width: 100%;">
                        <div id="reminder-date-text" class="reminder-date-text-container">
                            <div class="reminder-date-single placeholder">選擇提醒日期</div>
                        </div>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); flex-shrink: 0;">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <div id="reminder-content" contenteditable="false" placeholder="輸入提醒事項" onclick="openFullEditor()"></div>
            </div>

            <div id="bookmark-form-container" style="display: none; flex-direction: column;">
                <input type="hidden" id="bookmark-id-val">
                <input type="hidden" id="bookmark-category">
                <input type="hidden" id="bookmark-sub-category">
                <input type="text" id="bookmark-title" class="custom-input" placeholder="名稱" style="margin-bottom: 12px;" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                
                <div class="input-row" id="bookmark-url-row" style="margin-bottom: 12px;">
                    <input type="url" id="bookmark-url" class="custom-input" placeholder="URL" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
                </div>
                
                <div class="category-select-display" id="bookmark-category-select-display" onclick="openCategorySubCategoryModal()">
                    <div id="bookmark-category-display-text" class="category-display-text placeholder">選擇分類-子分類</div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); flex-shrink: 0;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7.3 8.2a5.2 5.2 0 0 1 10.4 0"></path>
                <path d="M10.3 15.8V8.2a2.2 2.2 0 0 1 4.4 0v3.3h2.1a4.2 4.2 0 0 1 4.2 4.2v2.6a3.7 3.7 0 0 1-3.7 3.7h-2.5"></path>
                <path d="M10.3 15.8l-1.5-1.3a2.6 2.6 0 0 0-3.7 3.7l4.1 3.8"></path>
                <line x1="9.2" y1="22" x2="14.8" y2="22"></line>
            </svg>
            <span>手動同步</span>
        </div>
        <div id="sidebar-collapsed-logout-item" class="category-popover-item danger" onclick="triggerCollapsedMenuLogout(event)" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>登出</span>
        </div>
    </div>

    <div id="text-toolbar" class="text-toolbar glass-effect">
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'cut', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'copy', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleClipboard(event, 'paste', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleFormat(event, 'color', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="8" fill="#9A871E"></circle>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A871E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
        <button tabindex="-1" class="icon-btn animated-action-btn" onmousedown="event.preventDefault()" ontouchstart="event.preventDefault()" onclick="handleFormat(event, 'bold', this)">
            <svg class="icon-main" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            </svg>
            <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
    </div>

    <div id="full-editor-modal" class="glass-effect">
        <div class="full-editor-actions" style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border);">
            <input type="text" id="full-reminder-title-input" class="custom-input" placeholder="名稱" style="display: none;" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
            <div class="right-actions" style="display: flex; gap: 12px; position: relative; margin-left: auto;">
                <button class="icon-btn circle-btn done-btn" onclick="saveFullEditor()" style="width: 44px; height: 44px; margin: 0; position: relative; z-index: 2;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
        <div id="full-note-content" contenteditable="true" placeholder="開始記錄..." style="flex: 1; overflow-y: auto;"></div>
    </div>

    <script src="https://unpkg.com/dexie@4.4.6/dist/dexie.min.js" integrity="sha384-3Lo+4VBEoe0BfmgnZYSfnLLPl0oJP2Vollzp9dr/049j77QxYLmjvhWidTB39osu" crossorigin="anonymous"></script>
    <script type="module" src="main.js?v=66"></script>
</body>
</html>
